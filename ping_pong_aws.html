<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pong</title>
    <style>
      :root {
        --bg: #070b16;
        --bg-glow: rgba(79, 209, 255, 0.14);
        --panel: rgba(16, 22, 36, 0.82);
        --panel-border: rgba(123, 142, 186, 0.28);
        --fg: #ebf1ff;
        --muted: #9aaad1;
        --player: #4fd1ff;
        --ai: #090809;
        --accent: #85f6be;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(
            circle at top,
            rgba(79, 209, 255, 0.14),
            transparent 30%
          ),
          radial-gradient(
            circle at bottom right,
            rgba(255, 107, 157, 0.12),
            transparent 25%
          ),
          var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px 16px;
      }

      .game-shell {
        width: min(920px, 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .top-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 6px 14px;
        background: rgba(15, 22, 37, 0.72);
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        box-shadow: 0 0 20px rgba(79, 209, 255, 0.08);
      }

      .top-bar span {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 36px);
        letter-spacing: 0.42em;
        font-weight: 800;
        text-transform: uppercase;
        text-shadow: 0 0 18px rgba(79, 209, 255, 0.26);
      }

      .game-frame {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        padding: 16px;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.02),
          0 18px 50px rgba(0, 0, 0, 0.35),
          0 0 28px rgba(79, 209, 255, 0.12);
      }

      canvas {
        display: block;
        width: min(820px, 90vw);
        height: auto;
        background: #000;
        border: 2px solid rgba(129, 147, 193, 0.4);
        border-radius: 14px;
        box-shadow:
          inset 0 0 22px rgba(255, 255, 255, 0.03),
          0 0 28px rgba(79, 209, 255, 0.12),
          0 0 42px rgba(255, 107, 157, 0.08);
        touch-action: none;
      }

      p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        letter-spacing: 0.04em;
        opacity: 0.9;
        text-align: center;
        color: var(--muted);
        padding: 0 12px;
      }

      b {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="top-bar"><span>Arcade Mode</span></div>
      <h1>PONG</h1>
      <div class="game-frame">
        <canvas id="game" width="800" height="500"></canvas>
      </div>
      <p>
        Move: <b>W / S</b> or <b>↑ / ↓</b> (or drag on touch). Press
        <b>Space</b> or click to start / pause.
      </p>
    </div>
    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const W = canvas.width,
        H = canvas.height;

      const PADDLE_W = 12,
        PADDLE_H = 90,
        MARGIN = 20,
        PADDLE_SPEED = 420;
      const BALL_R = 8,
        BALL_START = 360,
        BALL_MAX = 700,
        SPEEDUP = 1.05;
      const AI_SPEED = 270,
        AI_DEADZONE = 14,
        MAX_ANGLE = Math.PI / 3;

      const player = {
        x: MARGIN,
        y: (H - PADDLE_H) / 2,
        w: PADDLE_W,
        h: PADDLE_H,
        score: 0,
      };
      const ai = {
        x: W - MARGIN - PADDLE_W,
        y: (H - PADDLE_H) / 2,
        w: PADDLE_W,
        h: PADDLE_H,
        score: 0,
      };
      const ball = {
        x: W / 2,
        y: H / 2,
        r: BALL_R,
        dx: 0,
        dy: 0,
        speed: BALL_START,
      };

      const keys = {};
      addEventListener("keydown", (e) => {
        if (["ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
        if (e.key === " " && !e.repeat) toggle();
        keys[e.key.toLowerCase()] = true;
      });
      addEventListener("keyup", (e) => {
        keys[e.key.toLowerCase()] = false;
      });
      addEventListener("blur", () => {
        for (const k in keys) keys[k] = false;
      });

      function pointerY(e) {
        const r = canvas.getBoundingClientRect();
        return (e.clientY - r.top) * (H / r.height);
      }
      let dragging = false;
      canvas.addEventListener("pointerdown", (e) => {
        dragging = true;
        if (state !== "playing") toggle();
        player.y = clamp(pointerY(e) - player.h / 2, 0, H - player.h);
      });
      canvas.addEventListener("pointermove", (e) => {
        if (dragging)
          player.y = clamp(pointerY(e) - player.h / 2, 0, H - player.h);
      });
      addEventListener("pointerup", () => {
        dragging = false;
      });

      let state = "ready";
      let serveTimer = 0;
      const trail = [];
      const pulse = { p: 0, a: 0 };
      let wallFlash = 0;

      function clamp(v, lo, hi) {
        return Math.max(lo, Math.min(hi, v));
      }
      function toggle() {
        if (state === "ready") {
          state = "playing";
          resetBall(1);
        } else if (state === "playing") state = "paused";
        else state = "playing";
      }

      function resetBall(dir) {
        ball.x = W / 2;
        ball.y = H / 2;
        ball.speed = BALL_START;
        const a = (Math.random() * 2 - 1) * (Math.PI / 6);
        ball.dx = dir * ball.speed * Math.cos(a);
        ball.dy = ball.speed * Math.sin(a);
        serveTimer = 0.8;
        trail.length = 0;
      }

      function circleRect(b, p) {
        const cx = clamp(b.x, p.x, p.x + p.w);
        const cy = clamp(b.y, p.y, p.y + p.h);
        const dx = b.x - cx,
          dy = b.y - cy;
        return dx * dx + dy * dy <= b.r * b.r;
      }

      function paddleBounce(p, dir) {
        p.flash = 1;
        const rel = clamp((ball.y - (p.y + p.h / 2)) / (p.h / 2), -1, 1);
        const angle = rel * MAX_ANGLE;
        ball.speed = Math.min(ball.speed * SPEEDUP, BALL_MAX);
        ball.dx = dir * ball.speed * Math.cos(angle);
        ball.dy = ball.speed * Math.sin(angle);
      }

      function update(dt) {
        player.flash = Math.max(0, (player.flash || 0) - dt * 4);
        ai.flash = Math.max(0, (ai.flash || 0) - dt * 4);
        pulse.p = Math.max(0, pulse.p - dt * 2.5);
        pulse.a = Math.max(0, pulse.a - dt * 2.5);
        wallFlash = Math.max(0, wallFlash - dt * 5);

        let move = 0;
        if (keys["w"] || keys["arrowup"]) move -= 1;
        if (keys["s"] || keys["arrowdown"]) move += 1;
        player.y = clamp(player.y + move * PADDLE_SPEED * dt, 0, H - player.h);

        const target = ball.dx > 0 ? ball.y : H / 2;
        const diff = target - (ai.y + ai.h / 2);
        if (Math.abs(diff) > AI_DEADZONE) {
          ai.y += Math.sign(diff) * Math.min(AI_SPEED * dt, Math.abs(diff));
        }
        ai.y = clamp(ai.y, 0, H - ai.h);

        if (serveTimer > 0) {
          serveTimer -= dt;
          return;
        }

        ball.x += ball.dx * dt;
        ball.y += ball.dy * dt;
        trail.push({ x: ball.x, y: ball.y });
        if (trail.length > 14) trail.shift();

        if (ball.y - ball.r < 0) {
          ball.y = ball.r;
          ball.dy = -ball.dy;
          wallFlash = 1;
        }
        if (ball.y + ball.r > H) {
          ball.y = H - ball.r;
          ball.dy = -ball.dy;
          wallFlash = 1;
        }

        if (ball.dx < 0 && circleRect(ball, player) && ball.x > player.x) {
          ball.x = player.x + player.w + ball.r;
          paddleBounce(player, 1);
        } else if (
          ball.dx > 0 &&
          circleRect(ball, ai) &&
          ball.x < ai.x + ai.w
        ) {
          ball.x = ai.x - ball.r;
          paddleBounce(ai, -1);
        }

        if (ball.x + ball.r < 0) {
          ai.score++;
          pulse.a = 1;
          resetBall(1);
        } else if (ball.x - ball.r > W) {
          player.score++;
          pulse.p = 1;
          resetBall(-1);
        }
      }

      function drawPaddle(p, glow) {
        const f = p.flash || 0;
        ctx.save();
        ctx.shadowColor = glow;
        ctx.shadowBlur = 12 + 22 * f;
        ctx.fillStyle = "#fff";
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.restore();
      }

      function drawScore(text, x, color, pul) {
        ctx.save();
        ctx.translate(x, 62);
        ctx.scale(1 + 0.35 * pul, 1 + 0.35 * pul);
        ctx.font = "bold 54px monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 14 + 16 * pul;
        ctx.fillText(text, 0, 0);
        ctx.restore();
      }

      function draw() {
        const bg = ctx.createLinearGradient(0, 0, 0, H);
        bg.addColorStop(0, "#0b1020");
        bg.addColorStop(1, "#04060d");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "rgba(79,209,255,0.035)";
        ctx.fillRect(0, 0, W / 2, H);
        ctx.fillStyle = "rgba(255,107,157,0.035)";
        ctx.fillRect(W / 2, 0, W / 2, H);

        ctx.fillStyle =
          wallFlash > 0
            ? "rgba(255,255,255," + (0.25 + 0.6 * wallFlash) + ")"
            : "#2a3350";
        ctx.fillRect(0, 0, W, 3);
        ctx.fillRect(0, H - 3, W, 3);

        ctx.fillStyle = "#2a3350";
        for (let y = 12; y < H - 6; y += 30) ctx.fillRect(W / 2 - 2, y, 4, 16);

        drawScore(player.score, W / 4, "#4fd1ff", pulse.p);
        drawScore(ai.score, (3 * W) / 4, "#ff6b9d", pulse.a);
        ctx.font = "13px monospace";
        ctx.textAlign = "center";
        ctx.fillStyle = "#7d89a8";
        ctx.fillText("PLAYER", W / 4, 88);
        ctx.fillText("AI", (3 * W) / 4, 88);

        drawPaddle(player, "#4fd1ff");
        drawPaddle(ai, "#ff6b9d");

        for (let k = 0; k < trail.length; k++) {
          const t = (k + 1) / trail.length;
          ctx.fillStyle = "rgba(255,255,255," + 0.18 * t + ")";
          ctx.beginPath();
          ctx.arc(
            trail[k].x,
            trail[k].y,
            ball.r * (0.35 + 0.65 * t),
            0,
            Math.PI * 2,
          );
          ctx.fill();
        }

        if (state === "playing" && serveTimer > 0) {
          ctx.strokeStyle = "rgba(255,255,255," + Math.min(1, serveTimer) + ")";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r + 6 + serveTimer * 22, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.save();
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 16;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (state !== "playing") {
          const panelX = W / 2 - 220;
          const panelY = H / 2 - 92;
          const panelW = 440;
          const panelH = 170;

          ctx.fillStyle = "rgba(8, 12, 20, 0.7)";
          ctx.fillRect(panelX, panelY, panelW, panelH);
          ctx.strokeStyle = "rgba(79,209,255,0.32)";
          ctx.lineWidth = 2;
          ctx.strokeRect(panelX, panelY, panelW, panelH);

          ctx.textAlign = "center";
          ctx.fillStyle = "#fff";
          ctx.font = "bold 42px monospace";
          ctx.fillText(
            state === "ready" ? "START" : "PAUSED",
            W / 2,
            H / 2 - 18,
          );

          ctx.font = "18px monospace";
          ctx.fillStyle = "#dfe9ff";
          ctx.fillText(
            state === "ready"
              ? "Press Space or click to begin"
              : "Press Space or click to resume",
            W / 2,
            H / 2 + 28,
          );

          ctx.font = "14px monospace";
          ctx.fillStyle = "#9aaad1";
          ctx.fillText("W / S  or  ↑ / ↓  to move", W / 2, H / 2 + 58);
        }
      }
      // Start the game loop
      let last = performance.now();
      function loop(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        if (state === "playing") update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
